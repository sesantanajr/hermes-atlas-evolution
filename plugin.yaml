name: hermes-atlas-evolution
version: "0.8.0"
requires_hermes: ">=0.23.1"
description: >-
  A measured self-improvement loop for Hermes Agent. Learns from Hermes' own history on the first pass,
  runs by itself in the background, turns recurring tool failures into short lessons, measures every lesson,
  skill rewrite and setting change before and after, points out what slows Hermes down (tools slow call after
  call, approvals nobody could answer, heavy context, weak compaction) and stops the agent from taking down
  the gateway it runs on. Lessons from fixed templates apply at once (after the owner's own
  turns hit the failure) and are retired when they do not help; text written by a model or by the agent waits
  for your approval. Lessons travel between profiles as packs, and an Evolution tab in the dashboard shows what
  was learned and what waits for you.
license: MIT
homepage: https://github.com/sesantanajr/hermes-atlas-evolution
author: "Sérgio Sant'Ana Júnior"
tags:
  - self-improvement
  - observability
  - skills
  - operations
provides_tools:
  - hermes_atlas_evolution_plan
  - hermes_atlas_evolution_lessons
provides_hooks:
  - pre_tool_call
  - post_api_request
  - api_request_error
  - post_auxiliary_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_skill_lifecycle
  - subagent_start
  - subagent_stop
  - post_compaction
  - post_curator_run
  - on_kanban_worker_exited
  - on_session_finalize
  - on_kanban_dispatch_tick
config_schema:
  lessons:
    type: str
    choices: ["off", suggest, auto]
    default: auto
    label: Lessons
    description: >-
      auto (default): recurring failures become active lessons written from fixed templates, each one is measured
      and the ineffective ones are retired; drafts written by a model still wait for your approval.
      suggest: every lesson waits for your approval. off: measure only.
  language:
    type: str
    choices: [auto, en, pt]
    default: auto
    label: Language
    description: Language of lessons, messages and the digest. auto follows HERMES_LANGUAGE and display.language.
  tool_hints:
    type: bool
    default: false
    label: Lesson on failure
    description: >-
      Also add the matching lesson to a failing tool result, once per session. Off by default: Hermes keeps only
      the first plugin's change to a tool result, so a hint would discard another plugin's change to that result.
  feedback_signals:
    type: bool
    default: true
    label: Owner signals
    description: Count your corrections, repeated questions and thanks as numbers. No message text is stored.
  agent_tools:
    type: bool
    default: false
    label: Agent tools
    description: Offer hermes_atlas_evolution_plan and hermes_atlas_evolution_lessons to the agent. Proposed lessons stay quarantined.
  slow_turn_seconds:
    type: int
    default: 60
    label: Slow turn (seconds)
    description: A turn longer than this counts as slow. From 5 to 3600.
  owner_sender_ids:
    type: list
    default: []
    label: Owner sender ids
    description: >-
      Your sender ids on messaging platforms (text or numbers, such as a Telegram id). Turns from these senders
      count as yours (feedback, failures that may activate a lesson, the agent tools); the local CLI, TUI and
      Desktop always do. Anyone else in a chat gets template lessons only. `hermes evolution owner` lists the
      senders of each chat channel.
  owner_platforms:
    type: list
    default: []
    label: Owner platforms
    description: >-
      Platforms where every chat is yours, such as a private bot or your own interface through the API server
      (telegram, api_server, ...). Their chats count as yours from the first message, so they get all your
      lessons. `hermes evolution owner add-platform <name>` prints the command that sets it.
  reflector:
    type: bool
    default: true
    label: Reflector
    description: >-
      Draft lessons for recurring failures that have no template, using the model of Hermes' auxiliary task
      evolution_reflector (it inherits the compression model). Keeps one scrubbed error excerpt per failure until a
      draft exists, for failures in the owner's own turns only. Drafts always wait for your approval.
  reflector_daily_limit:
    type: int
    default: 6
    label: Reflector calls per day
    description: Upper limit of model calls the reflector makes per day. From 1 to 50.
  autopilot_minutes:
    type: int
    default: 60
    label: Autopilot (minutes)
    description: >-
      Run the learning pass by itself in the background, at most once per interval, from 15 to 1440 minutes.
      0 turns the background pass off; passes then run only from hermes evolution learn, ops tick, the weekly
      digest recipe and the first status.
  runtime_guard:
    type: bool
    default: true
    label: Runtime guard
    description: >-
      Stop the agent from taking down the Hermes it runs in. Vetoes terminal commands that restart or kill the
      gateway (systemd, launchd or a Windows service or task; the agent is told to leave the restart to the owner,
      whose hermes gateway restart asks before interrupting running turns), that delete the running Python, the
      Hermes code or this profile, or that change this plugin's settings or switch it off. Off where plugins run
      in a plugin host.
