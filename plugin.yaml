name: hermes-atlas-evolution
version: "0.12.0"
requires_hermes: ">=0.23.1"
description: >-
  Looks after your whole Hermes Agent, every profile at once. Every day it runs Hermes' own doctor checks
  offline and explains each problem with the command that fixes it; turns tool errors that keep coming back
  into short lessons the agent reads, and drops the ones that do not help; removes duplicate memory entries;
  points out plugins that conflict, duplicate or never load and skills that are unused or repeated; watches the
  gateway, the disk and the server's updates; and stops the agent from taking Hermes down. Safe changes happen
  by themselves with undo; the rest waits for one key in `hermes evolution` or the dashboard's Evolution tab.
  Português: cuida do seu Hermes inteiro, de todos os perfis. Todo dia roda as checagens do próprio
  `hermes doctor` sem rede e explica cada problema com o comando que resolve; transforma erros repetidos em
  lições curtas; remove entradas repetidas da memória; aponta plugins em conflito, duplicados ou que nunca
  carregam e skills sem uso; cuida do gateway, do disco e das atualizações do servidor. O que é seguro ele faz
  sozinho, com desfazer; o resto espera uma tecla.
license: MIT
homepage: https://github.com/sesantanajr/hermes-atlas-evolution
author: "Sérgio Sant'Ana Júnior"
tags:
  - self-improvement
  - observability
  - skills
  - operations
provides_tools:
  - hermes_atlas_evolution_lessons
provides_hooks:
  - pre_tool_call
  - post_api_request
  - api_request_error
  - post_auxiliary_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_skill_lifecycle
  - subagent_start
  - post_compaction
  - on_session_finalize
  - on_kanban_dispatch_tick
  - on_session_reset
  - on_session_delete
config_schema:
  lessons:
    type: str
    choices: ["off", suggest, auto]
    default: auto
    label: "Lessons · Lições"
    description: >-
      auto = automatic (default): recurring failures become lessons from a built-in template, each one measured and
      retired when it does not help; drafts written by a model still wait for you. suggest = on approval: every lesson
      waits for you. off = off: only measure.
      — auto = automáticas (padrão): falhas que se repetem viram lições de padrão fixo, cada uma medida e aposentada
      quando não ajuda; rascunhos escritos por um modelo continuam esperando você. suggest = com aprovação: toda lição
      espera você. off = desligadas: só medir.
  language:
    type: str
    choices: [auto, en, pt]
    default: auto
    label: "Language · Idioma"
    description: >-
      Language of lessons, messages, the menu and the digest; auto follows Hermes' language.
      — Idioma das lições, mensagens, do menu e do resumo; auto segue o idioma do Hermes.
  tool_hints:
    type: bool
    default: false
    label: "Add the lesson to the failing tool result · Juntar a lição ao resultado da ferramenta que falhou"
    description: >-
      Once per session. Off by default: Hermes keeps only the first plugin's change to a tool result, so this would
      discard another plugin's change. Turning it on counts only from Hermes' configuration. Applies after hermes
      gateway restart (in the terminal, at the next session).
      — Uma vez por sessão. Desligado por padrão: o Hermes fica só com a mudança do primeiro plugin no resultado de uma
      ferramenta, então isto descartaria a mudança de outro plugin. Ligar só vale pela configuração do Hermes. Vale
      depois de hermes gateway restart (no terminal, na próxima sessão).
  feedback_signals:
    type: bool
    default: true
    label: "Count your corrections and thanks · Contar as suas correções e agradecimentos"
    description: >-
      Counts your corrections, repeated questions and thanks as numbers only; no message text is stored.
      — Conta as suas correções, perguntas repetidas e agradecimentos só como números; nenhum texto de mensagem é
      guardado.
  agent_tools:
    type: bool
    default: false
    label: "Let the agent read and propose lessons · Deixar o agente ler e propor lições"
    description: >-
      Gives the agent the tool hermes_atlas_evolution_lessons (search the lessons, propose one); lessons it proposes
      wait for you. Turning it on applies after hermes gateway restart (in the terminal, at the next session).
      — Dá ao agente a ferramenta hermes_atlas_evolution_lessons (buscar lições, propor uma); as lições que ele
      propõe esperam você. Ligar vale depois de hermes gateway restart (no terminal, na próxima sessão).
  slow_turn_seconds:
    type: int
    default: 60
    label: "A turn is slow after (seconds) · Um turno é lento depois de (segundos)"
    description: >-
      A turn longer than this counts as slow. From 5 to 3600.
      — Um turno mais longo que isso conta como lento. De 5 a 3600.
  owner_sender_ids:
    type: list
    default: []
    label: "Senders that count as you · Remetentes que contam como você"
    description: >-
      Your sender ids in chat channels (such as a Telegram id). Their turns count as yours: in direct chats you get
      every lesson from your first message (the ones the chat's prompt leaves out come with it, once per chat; never
      in groups or threads), and the failures teach. Your CLI, TUI and Desktop always count. Counts only from Hermes' configuration. To see and mark
      the senders: hermes evolution, option 7 (Which chats count as you).
      — Os seus ids de remetente nos canais de chat (como um id do Telegram). Os turnos deles contam como seus: nas
      conversas diretas você recebe todas as lições desde a sua primeira mensagem (as que o prompt do chat deixa de
      fora chegam com ela, uma vez por conversa; nunca em grupos ou tópicos), e as falhas ensinam. A sua CLI, TUI e Desktop sempre contam. Só vale pela configuração
      do Hermes. Para ver e marcar os remetentes: hermes evolution, opção 7 (Quem é você nos chats).
  owner_platforms:
    type: list
    default: []
    label: "Channels where every chat counts as you · Canais em que todo chat conta como você"
    description: >-
      Channels where every chat is yours, such as a private bot (telegram) or your own interface through the API
      server (api_server). Mark only what nobody else uses.
      — Canais em que todo chat é seu, como um bot privado (telegram) ou a sua própria interface pelo servidor de API
      (api_server). Marque só o que ninguém mais usa.
  reflector:
    type: bool
    default: true
    label: "Reflector · Refletor"
    description: >-
      An AI model (Hermes' auxiliary task evolution_reflector) drafts lessons for failures with no built-in template,
      in your own turns only; it keeps one excerpt of the error, without sensitive data, per failure until a draft
      exists. Drafts always wait for you. Turning it on applies after hermes gateway restart (in the terminal, at the
      next session); turning it off applies at the next learning pass.
      — Um modelo de IA (a tarefa auxiliar evolution_reflector do Hermes) rascunha lições para falhas sem padrão fixo,
      só nos seus próprios turnos; guarda um trecho do erro sem dados sensíveis por falha até haver um rascunho. Os
      rascunhos sempre esperam você. Ligar vale depois de hermes gateway restart (no terminal, na próxima sessão);
      desligar vale na próxima rodada de aprendizado.
  reflector_daily_limit:
    type: int
    default: 6
    label: "Reflector calls per day · Chamadas do refletor por dia"
    description: >-
      Most model calls the reflector makes in a day. From 1 to 50; above 6 counts only from Hermes' configuration.
      — Máximo de chamadas ao modelo que o refletor faz por dia. De 1 a 50; acima de 6 só vale pela configuração do
      Hermes.
  autopilot_minutes:
    type: int
    default: 60
    label: "Learning pass every (minutes) · Rodada de aprendizado a cada (minutos)"
    description: >-
      Runs the learning pass by itself in the background, at most once per interval, from 15 to 1440 minutes; 0 = only
      by hand (hermes evolution learn, or option 11 of the hermes evolution menu).
      — Faz a rodada de aprendizado sozinho em segundo plano, no máximo uma vez por intervalo, de 15 a 1440 minutos;
      0 = só à mão (hermes evolution learn, ou a opção 11 do menu hermes evolution).
  mode:
    type: str
    choices: [auto, assist, manual]
    default: auto
    label: "Mode · Modo"
    description: >-
      auto = Auto mode (default): looks after every profile of this Hermes and does by itself what is safe and can be
      undone: it removes duplicate memory entries (keeps a copy of the file first), locks skills the curator keeps
      rewriting, installs itself in profiles in use and keeps every profile's copy on the same code, cleans failed
      installs, repairs the gateway's service when Hermes removed the Python it started, and frees old tool versions;
      the rest waits for you. assist = Assisted: on its own it only removes duplicate memory entries; everything else waits for you.
      manual = Manual: only measures and proposes. Every action is in the history with its undo.
      — auto = Modo Auto (padrão): cuida de todos os perfis deste Hermes e faz sozinho o que é seguro e tem desfazer:
      remove entradas repetidas da memória (guarda uma cópia do arquivo antes), trava skills que o curador reescreve
      sem parar, instala-se nos perfis em uso e mantém a cópia de cada perfil no mesmo código, limpa instalações que
      falharam, repara o serviço do gateway quando o Hermes removeu o Python que ele iniciava e libera versões antigas
      de ferramentas; o resto espera você. assist = Assistido: sozinho, só remove entradas repetidas da memória; o resto espera você.
      manual = Manual: só mede e propõe. Cada ação fica no histórico com o seu desfazer.
  fleet_managed:
    type: bool
    default: true
    label: "Let the lead profile act here · Deixar o perfil que cuida de todos agir aqui"
    description: >-
      Off = the lead profile, which looks after every profile of this Hermes, never installs, updates or moves
      anything to the trash in this profile by itself; it still shows what it finds. settings.json can only turn it
      off.
      — Desligado = o perfil que cuida de todos os perfis deste Hermes nunca instala, atualiza nem move nada para a
      lixeira neste perfil sozinho; continua mostrando o que encontra. O settings.json só pode desligar.
  runtime_guard:
    type: bool
    default: true
    label: "Runtime guard · Proteção do Hermes"
    description: >-
      Keeps the agent from taking down the Hermes it runs in: vetoes terminal commands that restart or kill the
      gateway, delete the running Python, Hermes' code or this profile, or change or switch off this plugin. Off where
      plugins run in a plugin host. Applies after hermes gateway restart (in the terminal, at the next session).
      — Impede o agente de derrubar o Hermes em que roda: barra comandos de terminal que reiniciam ou matam o gateway,
      apagam o Python em uso, o código do Hermes ou este perfil, ou mudam ou desligam este plugin. Desligada onde os
      plugins rodam num host de plugins. Vale depois de hermes gateway restart (no terminal, na próxima sessão).
