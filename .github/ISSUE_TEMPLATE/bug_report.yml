name: Bug report
description: Something in Atlas Evolution does not work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Security problems do not belong here: follow SECURITY.md instead.
        Please remove conversation content, credentials and personal paths from anything you paste.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The `version` field of `plugin.yaml`.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent version
      placeholder: "0.23.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: How was the command run?
      options:
        - hermes evolution (plugin loaded in process)
        - python -m hermes_atlas_evolution (standalone runner)
        - It happened in a hook, tool or prompt section while the agent was working
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Evolution loop (signals, lessons, skills by outcome, measurement, proposals, digest)
        - Reflector
        - Language (English or Portuguese text)
        - Operations supervisor (Linux, Cron, Kanban, usage)
        - Installation or Hermes integration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. For a hook problem, the warning from the Hermes log.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem, ideally against an empty profile directory.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: The parts of `<HERMES_HOME>/evolution/settings.json` and of `plugins.entries.hermes-atlas-evolution.settings` that matter, without identifiers such as sender IDs or unit names you prefer to keep private.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed conversation content, credentials and personal paths from this report.
          required: true
