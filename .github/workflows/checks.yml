name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Only the checks that find real defects: undefined names, unused imports and syntax the oldest
      # supported Python refuses. The plugin itself stays standard library only; ruff runs in CI alone.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.5"
      - name: Ruff
        run: ruff check --no-cache --target-version py311 --select F,E9,PLE --output-format github .
      - name: Byte-compile with the oldest supported Python
        run: python -m compileall -q hermes_atlas_evolution dashboard __init__.py
      - name: Installer syntax
        run: sh -n install.sh
      - name: Panel syntax
        run: node --check dashboard/dist/index.js

  tests:
    name: Tests · Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The test suite lives on the `tests` branch, so Hermes' clone of the default branch into every profile
      # stays small. A branch named tests-<this branch, with / as -> runs instead when it exists, so a change
      # and the tests it needs are reviewed together.
      - name: Fetch the test suite
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          candidate="tests-${BRANCH//\//-}"
          ref=tests
          if git ls-remote --exit-code --heads origin "$candidate" > /dev/null 2>&1; then ref="$candidate"; fi
          echo "Test suite from branch $ref"
          git fetch --depth 1 origin "refs/heads/$ref"
          mkdir -p tests
          git archive FETCH_HEAD | tar -x -C tests
      - name: Unit tests
        shell: bash
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.hermes"
          HOME="$home" USERPROFILE="$home" HERMES_HOME="$home/.hermes" python -m unittest discover -s tests
      # The plugin imports and its standalone runner answers on a throwaway profile (no Hermes needed).
      - name: Standalone CLI smoke test
        shell: bash
        run: |
          python -c "import hermes_atlas_evolution.integration, hermes_atlas_evolution.fleet_update"
          mkdir -p "$RUNNER_TEMP/profile"
          python -m hermes_atlas_evolution --home "$RUNNER_TEMP/profile" --help > /dev/null
          python -m hermes_atlas_evolution --home "$RUNNER_TEMP/profile" update --list --format json
