name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the checks that find real defects: undefined names, unused imports and syntax the oldest
      # supported Python refuses. The plugin itself stays standard library only; ruff runs in CI alone.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.5"
      - name: Ruff
        run: ruff check --no-cache --target-version py311 --select F,E9,PLE --output-format github .
      - name: Byte-compile with the oldest supported Python
        run: python -m compileall -q hermes_atlas_evolution dashboard __init__.py
      - name: Installer syntax
        run: sh -n install.sh

  smoke:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The plugin imports and its standalone runner answers on a throwaway profile (no Hermes needed).
      - name: Import and run the standalone CLI
        shell: bash
        env:
          ATLAS_EVOLUTION_NO_HERMES: "1"
        run: |
          python -c "import hermes_atlas_evolution.integration, hermes_atlas_evolution.fleet_update"
          mkdir -p "$RUNNER_TEMP/profile"
          python -m hermes_atlas_evolution --home "$RUNNER_TEMP/profile" --hermes-version 0.23.1 --help > /dev/null
          python -m hermes_atlas_evolution --home "$RUNNER_TEMP/profile" --hermes-version 0.23.1 update --list --format json
