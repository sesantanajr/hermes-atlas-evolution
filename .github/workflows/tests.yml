name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the checks that find real defects: undefined names, unused imports and syntax the oldest
      # supported Python refuses. The plugin itself stays standard library only; ruff runs in CI alone.
      # PLE2502/PLE2515: the guard tests carry bidi and zero-width characters on purpose.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.5"
      - name: Ruff
        run: ruff check --no-cache --target-version py311 --select F,E9,PLE --ignore PLE2502,PLE2515 --output-format github .
      - name: Byte-compile with the oldest supported Python
        run: python -m compileall -q hermes_atlas_evolution tests __init__.py

  unittest:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Hermes also runs on macOS (a LaunchAgent) and Windows (a service or task, Git Bash as the terminal).
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The plugin and its tests use the standard library only: there is nothing to install.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
